services:
  - type: web
    name: linkboost-growth
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DEFAULT_CURRENCY
        value: GHS
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: KORAPAY_PUBLIC_KEY
        sync: false
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
